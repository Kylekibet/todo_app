[project]
name = "todo-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kyle", email = "kyleomondi@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "bootstrap-flask>=2.6.0",
    "email-validator>=2.3.0",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "gunicorn>=26.2.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
todo-app = "todo_app:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pylint>=4.1.3",
]
